name: Build Vita3K ARM64 Linux

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Native ARM64 Dependencies
        run: |
          sudo apt-get update
          sudo apt install git cmake ninja-build libsdl2-dev pkg-config libgtk-3-dev clang lld xdg-desktop-portal openssl libssl-dev qt6-base-dev
      
      - name: Download Official Qt 6.11.0 Natively
        run: |
          pipx install aqtinstall
          aqt install-qt linux_arm64 desktop 6.11.0 linux_gcc_arm64 \
            --outputdir ${{ github.workspace }}/Qt \
            -m qtmultimedia 
            
      - name: Configure CMake Natively
        run: |
          cmake --preset linux-ninja-clang -DBoost_NO_SYSTEM_PATHS=ON \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.11.0/gcc_arm64" \
          -DQt6_DIR="${{ github.workspace }}/Qt/6.11.0/gcc_arm64/lib/cmake/Qt6"

      - name: Compile with High-Core Power
        run: cmake --build build/linux-ninja-clang

      - name: Package AppImage
        run: |
          # 1. Download linuxdeploy and its Qt plugin for ARM64
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
          chmod +x linuxdeploy-aarch64.AppImage linuxdeploy-plugin-qt-aarch64.AppImage
          
          # 2. Create a basic Desktop file and grab an icon (required for AppImages)
          cat <<EOF > Vita3K.desktop
          [Desktop Entry]
          Name=Vita3K
          Exec=Vita3K
          Icon=vita3k
          Type=Application
          Categories=Game;Emulator;
          EOF
          wget -O vita3k.png https://raw.githubusercontent.com/Vita3K/Vita3K/master/vfs/app/Vita3K/sce_sys/icon0.png
          
          # 3. Set environment variables to point linuxdeploy to our custom Qt 6.11.0
          export APPIMAGE_EXTRACT_AND_RUN=1  # Bypasses FUSE requirement on cloud runners
          export QMAKE="${{ github.workspace }}/Qt/6.11.0/gcc_arm64/bin/qmake"
          export EXTRA_QT_PLUGINS="wayland;multimedia;svg"
          
          # 4. Generate the AppDir and compile the final AppImage
          ./linuxdeploy-aarch64.AppImage --appdir AppDir \
            -e build/linux-ninja-clang/bin/Debug/Vita3K \
            -i vita3k.png \
            -d Vita3K.desktop \
            --plugin qt \
            --output appimage

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-ARM64-Binary
          path: build/linux-ninja-clang/bin/Debug/Vita3K
