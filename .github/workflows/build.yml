name: Build Vita3K ARM64 Linux

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Native ARM64 Dependencies
        run: |
          sudo apt-get update
          sudo apt install git cmake ninja-build libsdl2-dev pkg-config libgtk-3-dev clang lld xdg-desktop-portal openssl libssl-dev qt6-base-dev
      
      - name: Download Official Qt 6.11.0 Natively
        run: |
          pipx install aqtinstall
          aqt install-qt linux_arm64 desktop 6.11.0 linux_gcc_arm64 \
            --outputdir ${{ github.workspace }}/Qt \
            -m qtmultimedia 
            
      - name: Configure CMake Natively
        run: |
          cmake --preset linux-ninja-clang -DBoost_NO_SYSTEM_PATHS=ON \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.11.0/gcc_arm64" \
          -DQt6_DIR="${{ github.workspace }}/Qt/6.11.0/gcc_arm64/lib/cmake/Qt6"

      - name: Compile with High-Core Power
        run: cmake --build build/linux-ninja-clang
              -DBoost_NO_SYSTEM_PATHS=ON \
              -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.11.0/gcc_arm64" \
              -DQt6_DIR="${{ github.workspace }}/Qt/6.11.0/gcc_arm64/lib/cmake/Qt6"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-ARM64-Binary
          path: build/bin/Vita3K
