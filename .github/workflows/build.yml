name: Build Vita3K ARM64 Linux

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Native ARM64 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ gcc \
            pkg-config \
            libssl-dev libsdl2-dev libgtk-3-dev \
            libx11-dev libwayland-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype6-dev \
            libharfbuzz-dev libpng-dev libjpeg-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev \
            libqt6core6 libqt6gui6 libqt6widgets6 \
            libqt6network6 libqt6concurrent6 \
            libqt6svg6 libqt6multimedia6

      - name: Configure CMake Natively
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DYUZU_USE_BUNDLED_FFMPEG=OFF \
            -DBoost_NO_SYSTEM_PATHS=ON

      - name: Compile with High-Core Power
        run: cmake --build build -j$(nproc)

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-ARM64-Binary
          path: build/bin/Vita3K
